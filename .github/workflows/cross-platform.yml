# ЛР 7: перевірка на інших системах.
# На моєму комп'ютері немає ні WSL, ні Docker, тому застосунок збирає
# й запускає GitHub на справжніх машинах з Linux, macOS і Windows.
# Виведення кожного запуску видно в анотаціях до прогону (Summary → Annotations).
name: Збірка на трьох системах

on:
  push:
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      OUT: publish/${{ matrix.rid }}/HomeBudget.App
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Збірка розв'язку
        run: dotnet build HomeBudget.slnx -c Release

      - name: Пакет ядра й BudgetReport (ЛР 6)
        run: |
          dotnet pack HomeBudget.Core -c Release -o ./packages
          dotnet build tools/BudgetReport -c Release

      - name: Самодостатня збірка під цю систему
        run: dotnet publish HomeBudget.App -c Release -r ${{ matrix.rid }} --self-contained true -o $OUT

      - name: --info із самодостатньої збірки
        run: |
          chmod +x $OUT/budget 2>/dev/null || true
          $OUT/budget --info | tee info.txt
          { echo "Розмір збірки: $(du -sh $OUT | cut -f1), файлів: $(find $OUT -type f | wc -l)"
            file $OUT/budget* 2>/dev/null | sed 's|.*/||' || true; } | tee size.txt

      - name: --kinds
        run: $OUT/budget --kinds | tee kinds.txt

      - name: Сеанс із введенням і файл журналу
        if: runner.os != 'Windows'
        run: |
          printf '3000\nКартка\nКартка\nКартка\nКартка\nКартка\nКартка\n' | $OUT/budget | tail -9 | tee session.txt
          dir=$(sed -n 's/.*Каталог даних: \(.*[^ ]\) *│.*//p' info.txt)
          echo "Файл журналу:" | tee -a session.txt
          ls -l "$dir" | tee -a session.txt

      - name: Виведення в анотації
        if: always()
        run: |
          for f in info size kinds session; do
            [ -f $f.txt ] || continue
            msg=$(sed 's/%/%25/g' $f.txt | awk '{printf "%s%%0A", $0}')
            echo "::notice title=${{ matrix.rid }} ${f}::${msg}"
          done
